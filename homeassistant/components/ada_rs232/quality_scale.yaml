rules:
  action-setup:
    status: exempt
    comment: The integration registers no custom actions.
  appropriate-polling: done
  brands:
    status: done
    comment:
      Assets are prepared in the companion brands change at https://github.com/RebbePod/brands/tree/add-ada-rs232/core_integrations/ada_rs232.
      Availability is contingent on that change merging before Core.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration only exposes standard switch actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no custom triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  action-exceptions: todo
  config-entry-unloading: todo
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: todo
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow:
    status: exempt
    comment: The amplifier does not authenticate clients.
  test-coverage: todo
  devices: todo
  diagnostics: todo
  discovery: todo
  discovery-update-info: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Amplifier outputs are fixed.
  entity-category:
    status: exempt
    comment: All entities are primary power controls.
  entity-device-class:
    status: exempt
    comment: No switch device class describes an amplifier output.
  entity-disabled-by-default:
    status: exempt
    comment: All eight zone controls are primary entities.
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: No known persistent issue requires user action through a repair.
  stale-devices:
    status: exempt
    comment: No dynamic devices can become stale.
  async-dependency: todo
  inject-websession:
    status: exempt
    comment: The library uses serial connections, not HTTP.
  strict-typing: todo
